name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test Rust crates in Docker
        run: docker build --file website/Dockerfile --target rust-tests --tag research-rust-tests .

  website:
    name: Website checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build development image
        run: docker build --file website/Dockerfile --tag research-website .
      - name: Check dependencies, lint, types, and production build
        run: |
          docker run --rm research-website sh -lc '
            npm audit &&
            npm run lint &&
            npm run test:lint-integration &&
            npm run typecheck &&
            npm run build
          '
