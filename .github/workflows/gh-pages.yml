name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build development image
        run: docker build --file website/Dockerfile --tag research-website .
      - name: Export site in Docker
        run: |
          docker run --name website-export research-website npm run export
          docker cp website-export:/app/out website/out
      - name: Clean up export container
        if: always()
        run: docker rm --force website-export || true
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/out
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
