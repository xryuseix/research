services:
  web:
    build:
      context: ..
      dockerfile: website/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next:/app/.next
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    init: true

volumes:
  node_modules:
  next:
